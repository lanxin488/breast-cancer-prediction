<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面未找到 - 乳腺癌预测系统</title>
    <style>
        body { font-family: 'Microsoft YaHei', sans-serif; background: #f5f7fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .error-container { text-align: center; padding: 50px; background: white; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .error-icon { font-size: 80px; margin-bottom: 20px; }
        .error-title { font-size: 28px; color: #333; margin-bottom: 15px; }
        .error-message { color: #666; margin-bottom: 30px; font-size: 16px; }
        .btn { padding: 12px 30px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 25px; cursor: pointer; font-size: 16px; text-decoration: none; }
        .btn:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">🔍</div>
        <h1 class="error-title">404 - 页面未找到</h1>
        <p class="error-message">抱歉，您访问的页面不存在或已被删除。</p>
        <a href="/" class="btn">🏠 返回首页</a>
    </div>
</body>
</html>
