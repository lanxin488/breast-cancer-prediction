{% extends "base.html" %}

{% block title %}注册 - 乳腺癌预测系统{% endblock %}

{% block content %}
    <div class="card" style="max-width: 450px; margin: 0 auto;">
        <h2 style="text-align: center; color: #667eea;">📝 用户注册</h2>
        
        <form method="POST" action="/register">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名" required>
            </div>
            
            <div class="form-group">
                <label for="email">邮箱</label>
                <input type="email" id="email" name="email" placeholder="请输入邮箱" required>
            </div>
            
            <div class="form-group">
                <label for="role">用户角色</label>
                <select id="role" name="role">
                    <option value="user">普通用户</option>
                    <option value="doctor">医生</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required>
            </div>
            
            <div class="form-group">
                <label for="confirm_password">确认密码</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="请再次输入密码" required>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%;">注册</button>
        </form>
        
        <p style="text-align: center; margin-top: 20px; color: #666;">
            已有账号？<a href="/login" style="color: #667eea;">立即登录</a>
        </p>
        
        <p style="text-align: center; margin-top: 10px; color: #999; font-size: 12px;">
            注册用户名为 <strong>admin</strong> 将获得超级管理员权限
        </p>
    </div>
{% endblock %}
